<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTIS — Albums & Music Videos</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            padding: 2rem 5%;
        }

        /* nav a {
            color: #888;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: #fff;
        } */
   /* Bentuk tombol garis tiga */
        .hamburger {
        display: flex;
        flex-direction: column;
        gap: 5px;
        cursor: pointer;
        }
        .hamburger span {
        width: 25px;
        height: 3px;
        background-color: white;
        border-radius: 2px;
        }

        /* Sembunyikan menu bawaan */
        .nav-menu {
        display: none; 
        position: absolute;
        top: 60px;
        right: 20px;
        background-color: #3a9167;
        padding: 5px;
        border-radius: 8px;
        flex-direction: column;
        /* Warna transparan dengan efek blur di belakangnya */
                background: rgba(65, 182, 129, 0.65);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                justify-content: space-between;
        }

        /* Munculkan menu pas diklik */
        .nav-menu.active {
        display: flex;
        }

        .nav-link {
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        }

        .nav-link:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
        cursor: pointer;
        }

        .page-title {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        /* Album Grid Layout */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2.5rem;
        }

        /* Album Card Item */
        .album-card {
            background-color: #12141a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e222d;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* Efek Hover: Membesar + Miring */
        .album-card:hover {
            transform: translateY(-6px) scale(1.04) rotate(2deg);
            border-color: #00ff66;
            box-shadow: 0 12px 25px rgba(0, 255, 102, 0.2);
            z-index: 2;
        }

        .cover-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Ratio 1:1 Square Album Cover */
            background-color: #1f2430;
            overflow: hidden;
        }

        .cover-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .album-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .album-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }

        .album-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #777;
        }

        .badge-count {
            background-color: #1f2430;
            color: #00ff66;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
            margin-top: 0.3rem;
        }

        /* Modal Overlay (Tampilan saat Album Dipencet) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
            padding: 2rem;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background-color: #12141a;
            border: 1px solid #00ff66;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.2);
        }

        .close-btn {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #00ff66;
        }

        .modal-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
        }

        .modal-album-title {
            font-size: 2rem;
            color: #00ff66;
            text-transform: uppercase;
        }

        /* Video List Inside Modal */
        .mv-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .mv-card {
            background-color: #1a1d26;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2f3d;
        }

        .mv-thumbnail {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            background-color: #000;
        }

        .mv-thumbnail iframe,
        .mv-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        .mv-info {
            padding: 0.8rem;
        }

        .mv-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
        }

        /* Style Scrollbar Modal */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-track {
            background: #12141a;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #00ff66;
            border-radius: 4px;
        }

        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #222;
            text-align: center;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
<div class="hamburger" onclick="document.getElementById('nav-menu').classList.toggle('active')">
        <span></span>
        <span></span>
        <span></span>
        </div>
    <nav class="nav-menu" id="nav-menu">
    <a href="index.html" class="nav-link">Home</a>
    <a href="profil.html" class="nav-link">Profil</a>
    <a href="foto.html" class="nav-link">Photos</a>
    <a href="achievements.html" class="nav-link">Achievements</a>
    <a href="album.html" class="nav-link">Discography/Album</a>
    <a href="musicvideo.html" class="nav-link">Music Video</a>
    <a href="songlyric.html" class="nav-link">Song Lyric & Fanchant</a>
    </nav>

    <h1 class="page-title">Discography & Music Videos</h1>

    <!-- Album Grid Container -->
    <main class="album-grid" id="albumGrid">
        <!-- Generatated via JS -->
    </main>

    <!-- Modal Popup untuk List MV -->
    <div class="modal-overlay" id="mvModal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <div class="modal-header">
                <h2 class="modal-album-title" id="modalAlbumTitle">Album Title</h2>
                <p style="color: #888; margin-top: 0.3rem;" id="modalAlbumSubtitle">List Music Video</p>
            </div>
            <div class="mv-list" id="mvListContainer">
                <!-- MV Cards di-generate oleh JavaScript -->
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 CORTIS / BIGHIT MUSIC. All rights reserved.</p>
    </footer>

    <script>
        // Data Album beserta List Music Video didalamnya
        const albumsData = [
            {
                id: 1,
                title: "GREENGREEN",
                year: "2026",
                type: "EP Album",
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=800&q=80",
                mvs: [
                    { title: "TNT (Concept Film)", embedUrl: "https://www.youtube.com/embed/XgmdslsEJ1M" },
                    { title: "GREENGREEN Title MV", embedUrl: "https://www.youtube.com/embed/6MYB61hUaFg" }
                ] // 2 Videos
            },
            {
                id: 2,
                title: "WHAT YOU WANT",
                year: "2025",
                type: "Debut Single",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=800&q=80",
                mvs: [
                    { title: "What You Want Official MV", embedUrl: "https://www.youtube.com/embed/6MYB61hUaFg" }
                ] // 1 Video
            },
            {
                id: 3,
                title: "COLOR OUTSIDE THE LINES",
                year: "2025",
                type: "Full Album",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=800&q=80",
                mvs: [
                    { title: "GO! Official MV", embedUrl: "" },
                    { title: "FaSHioN Performance Video", embedUrl: "" },
                    { title: "Color Outside Visualizer", embedUrl: "" },
                    { title: "Track 04 Special Clip", embedUrl: "" },
                    { title: "Track 05 B-Side MV", embedUrl: "" },
                    { title: "Track 06 Choreography Video", embedUrl: "" },
                    { title: "Outro Live Session", embedUrl: "" }
                ] // 7 Videos
            },
            {
                id: 4,
                title: "THE ARCHIVES & REMIXES",
                year: "2025",
                type: "Special Album",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=800&q=80",
                mvs: [
                    { title: "Intro MV", embedUrl: "" },
                    { title: "Archive Track 01", embedUrl: "" },
                    { title: "Archive Track 02", embedUrl: "" },
                    { title: "Remix 01 Special MV", embedUrl: "" },
                    { title: "Remix 02 Studio Ver.", embedUrl: "" },
                    { title: "Live Concert Edit 01", embedUrl: "" },
                    { title: "Live Concert Edit 02", embedUrl: "" },
                    { title: "Behind The Scene MV", embedUrl: "" },
                    { title: "Acoustic Session", embedUrl: "" },
                    { title: "Final Encore Video", embedUrl: "" }
                ] // 10 Videos
            }
        ];

        const albumGrid = document.getElementById('albumGrid');
        const mvModal = document.getElementById('mvModal');
        const closeBtn = document.getElementById('closeBtn');
        const modalAlbumTitle = document.getElementById('modalAlbumTitle');
        const modalAlbumSubtitle = document.getElementById('modalAlbumSubtitle');
        const mvListContainer = document.getElementById('mvListContainer');

        // Generate Kartu Album di Halaman Utama
        function renderAlbums() {
            albumGrid.innerHTML = albumsData.map(album => `
                <div class="album-card" onclick="openAlbumModal(${album.id})">
                    <div class="cover-container">
                        <img src="${album.cover}" alt="${album.title}">
                    </div>
                    <div class="album-info">
                        <h2 class="album-title">${album.title}</h2>
                        <div class="album-meta">
                            <span>${album.type}</span>
                            <span>${album.year}</span>
                        </div>
                        <span class="badge-count">🎬 ${album.mvs.length} Music Video</span>
                    </div>
                </div>
            `).join('');
        }

        // Buka Modal & Tampilkan List Video di Dalamnya
        function openAlbumModal(albumId) {
            const album = albumsData.find(a => a.id === albumId);
            if (!album) return;

            modalAlbumTitle.innerText = album.title;
            modalAlbumSubtitle.innerText = `${album.type} (${album.year}) — Total ${album.mvs.length} Video`;

            // Inner HTML untuk daftar MV
            mvListContainer.innerHTML = album.mvs.map(mv => `
                <div class="mv-card">
                    <div class="mv-thumbnail">
                        ${mv.embedUrl 
                            ? `<iframe src="${mv.embedUrl}" allowfullscreen></iframe>`
                            : `<img src="${album.cover}" alt="${mv.title}">`
                        }
                    </div>
                    <div class="mv-info">
                        <div class="mv-title">${mv.title}</div>
                    </div>
                </div>
            `).join('');

            mvModal.classList.add('active');
        }

        // Tutup Modal
        closeBtn.addEventListener('click', () => {
            mvModal.classList.remove('active');
            mvListContainer.innerHTML = ''; // Hentikan playback video saat ditutup
        });

        // Tutup jika klik di luar area modal
        mvModal.addEventListener('click', (e) => {
            if (e.target === mvModal) {
                mvModal.classList.remove('active');
                mvListContainer.innerHTML = '';
            }
        });

        // Jalankan awal
        renderAlbums();
    </script>

</body>
</html>
