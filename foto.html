<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORTIS</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: rgb(49, 113, 73);
            color: rgb(2, 0, 0);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;

        }

        body::before {
            content: '';
            position: fixed;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('weverse_3-336822377.jpeg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            /* 2. EFEK FADE / KEGELAPAN BACKGROUND (Atur kecerahan di sini) */
            /* Nilai 0.5 = 50% gelap (bisa kamu ubah dari 0.1 sampai 1.0) */
            filter: brightness(0.5);
            /* 3. EFEK SMOOTH / HALUS */
            /* transform 0.2s ease-out membuat pergerakan kursor terasa sangat mulus dan elastis */
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), filter 0.3s ease;

            z-index: -1;
            /* Memastikan background selalu ada di belakang konten */
            transform: translate(var(--bg-x, 0px), var(--bg-y, 0px)) scale(1.08);
        }

        header {
            background-color: rgb(54, 153, 90);
            text-align: center;
            padding: 15px;
            margin: 5px 0;
            position: sticky;
            top: 0;
            z-index: 100;

            /* Warna transparan dengan efek blur di belakangnya */
            background: rgba(35, 103, 72, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            display: flex;
            justify-content: space-between;
            /* Logo di kiri, Menu di kanan */
            align-items: center;
            padding: 10px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);

        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo:hover {
            transform: none;
            filter: none;
        }

        .header-logo {
            width: 40px;
            /* Ukuran logo */
            height: auto;
            border-radius: 6px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: aliceblue;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }

        nav {
            justify-content: center;
            display: flex;
            padding: 10px 0;
            background-color: rgb(9, 64, 39);
            display: flex;
            background-color: transparent;
            /* Transparan mengikuti header */
            padding: 0;
        }

        nav a {
            color: rgb(134, 193, 100);
            margin: 15px;

        }

        footer {
            background-color: rgb(35, 103, 72);
            text-align: center;
            color: rgb(205, 252, 252);
            margin: 15px 0;
            padding: 10px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        img {
            max-width: 100%;
            width: 300px;
            transition: all 0.3s ease;

        }

        img:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
            cursor: pointer;
            /* Mengubah kursor jadi telunjuk */
        }

        .foto-list-container {
            display: flex;
            justify-content: center;
            /* Mengetengahkan isi foto */
            align-items: center;
            flex-wrap: wrap;
            /* Memperbolehkan foto turun ke baris baru */
            max-width: 1100px;
            /* Membatasi lebar agar baris pertama cukup untuk 3 foto saja */
            margin: 0 auto;
            color: aliceblue;
        }

        #photo {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        .klik-foto {
            margin: 20px;
        }

        a {
            color: rgb(243, 248, 247);
            text-align: center;
        }

        body::before {
            /* Menghubungkan variabel posisi dari JavaScript + Zoom (scale) */
            transform: translate(var(--bg-x, 0px), var(--bg-y, 0px)) scale(1.08);
        }
    </style>

</head>

<body>
    <header>

        <div class="logo-box">
            <!-- Ganti 'logo.png' dengan nama file logomu -->
            <img src="2b64053aa52e4706ac5db831415cc435.png" alt="Logo CORTIS" class="header-logo">
            <h1>PHOTO</h1>
        </div>

        <nav>
            <a href="#photo">Photo</a>
            <a href="#about">About</a>
        </nav>
    </header>
    <section id="photo">
        <div class="foto-list-container">
            <a href="allobank.html">
                <div class="klik-foto">
                    <img width="120px" src="weverse_4-335927852.jpeg" />
                    <div>Allo Bank Festival</div>
                </div>
            </a>
            <a href="greengreen.html">
                <div class="klik-foto">
                    <img src="greengreen/weverse_1-304437090.jpeg" />
                    <div>GREEN GREEN Music Show Moments</div>
                </div>
            </a>
            <a href="releaseparty.html">
                <div class="klik-foto">
                    <img src="weverse_4-333192117.jpeg" />
                    <div>The 2nd EP RELEASE PARTY</div>
                </div>
            </a>
            <a href="putyourphonedown.html">
                <div class="klik-foto">
                    <img src="putyourphonedown/weverse_4-337293409.jpeg" />
                    <div>2026 CORTIS TOUR PYPD</div>
                </div> 
            </a>

        </div>
    </section>
    <script>
        document.addEventListener('mousemove', (e) => {
            // Menghitung posisi kursor dari titik tengah layar (-1 sampai 1)
            const mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            const mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

            // Jarak pergeseran gambar (semakin besar angkanya, semakin jauh gesernya)
            const moveX = mouseX * 20; // 20px ke kanan/kiri
            const moveY = mouseY * 20; // 20px ke atas/bawah

            // Menerapkan Efek Pergeseran + Zoom (scale 1.05 = nge-zoom 5%)
            const bg = document.querySelector('body');
            bg.style.setProperty('--bg-x', `${moveX}px`);
            bg.style.setProperty('--bg-y', `${moveY}px`);
        });
    </script>


</body>
